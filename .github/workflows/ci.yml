name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI deliberadamente offline: instala dependencias, chequea tipos y builda.
# `src/lib/db.ts` (y auth.ts/s3.ts) leen sus env vars de forma perezosa, recién
# en el primer uso real, así que `next build` ya no las exige. NO corre
# synth/deploy de CDK ni nada que necesite credenciales AWS o base de datos.
# Por eso este workflow no usa ningún secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin input `version`: la versión sale de "packageManager": "pnpm@9.0.0"
      # en el package.json raíz, una única fuente de verdad.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build
